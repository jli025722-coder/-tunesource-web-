<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
        nav{background:#222;color:white;padding:16px;display:flex;gap:24px;align-items:center}
        nav a{color:white;text-decoration:none}
        .container{max-width:800px;margin:30px auto;padding:0 20px}
        .item{padding:12px;border-bottom:1px solid #ddd}
    </style>
</head>
<body>
<nav>
    <h2>Tune-Source</h2>
    <a href="/">Home</a>
    <a href="/history">Download History</a>
    <a href="/admin">Admin</a>
</nav>
<div class="container">
    <h2>Admin - Music List</h2>
    {% for m in music %}
    <div class="item">
        <p>ID:{{m.id}} | Title: {{m.title}} | Artist: {{m.artist}}</p>
    </div>
    {% endfor %}
</div>
</body>
</html>
